buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.flywaydb:flyway-database-postgresql:10.15.0"
        classpath "org.postgresql:postgresql:42.7.3"
    }
}

plugins {
    id 'java'
    id 'application'
    id 'org.flywaydb.flyway' version '10.15.0'
}

group = 'com.bank'
version = '1.0-SNAPSHOT'

// Forces Gradle to use JDK 21 toolchain for compilation
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    postgresqlVersion = '42.7.3'
    hikaricpVersion = '5.1.0'
    flywayVersion = '10.15.0'
    lombokVersion = '1.18.34'
    jbcryptVersion = '0.4'
    slf4jVersion = '2.0.13'
    logbackVersion = '1.5.6'
    junitVersion = '5.10.2'
    mockitoVersion = '5.11.0'
    testcontainersVersion = '1.19.8'
}

dependencies {
    implementation "org.postgresql:postgresql:${postgresqlVersion}"
    implementation "com.zaxxer:HikariCP:${hikaricpVersion}"
    implementation "org.flywaydb:flyway-core:${flywayVersion}"
    implementation "org.flywaydb:flyway-database-postgresql:${flywayVersion}"
    implementation "org.mindrot:jbcrypt:${jbcryptVersion}"

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    implementation "ch.qos.logback:logback-classic:${logbackVersion}"

    implementation 'net.sf.jasperreports:jasperreports:6.21.3'
    implementation 'org.jline:jline:3.26.3'
    implementation 'com.williamcallahan:tui4j:0.3.3'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'

    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testImplementation "org.mockito:mockito-core:${mockitoVersion}"
    testImplementation "org.mockito:mockito-junit-jupiter:${mockitoVersion}"
    testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
    testImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
}

// Force UTF-8 encoding during compilation
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'com.bank.Main'
}

test {
    useJUnitPlatform()
}

flyway {
    configFiles = ['src/main/resources/application.properties']
}

// Configure run task with standard input and UTF-8 JVM flags
run {
    standardInput = System.in
    jvmArgs += [
            '-Dfile.encoding=UTF-8',
            '-Dsun.stdout.encoding=UTF-8',
            '-Dsun.stderr.encoding=UTF-8'
    ]
}

jar {
    manifest {
        attributes 'Main-Class': 'com.bank.Main'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}